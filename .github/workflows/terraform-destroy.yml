name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Workspace to destroy (NOT recoverable)'
        required: true
        type: choice
        options: [dev, prod]
      confirm:
        description: 'Type the workspace name again to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: 'true'
  ARM_USE_OIDC: 'true'
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

jobs:
  destroy:
    name: terraform destroy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Confirm workspace name
        run: |
          if [ "${{ github.event.inputs.environment }}" != "${{ github.event.inputs.confirm }}" ]; then
            echo "Confirmation '${{ github.event.inputs.confirm }}' does not match environment '${{ github.event.inputs.environment }}'." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=data-ai-mcp.tfstate" \
            -backend-config="use_oidc=true" \
            -input=false

      - name: terraform workspace
        working-directory: infra
        run: terraform workspace select "${{ github.event.inputs.environment }}"

      - name: terraform destroy
        working-directory: infra
        run: |
          terraform destroy \
            -auto-approve \
            -var-file="envs/${{ github.event.inputs.environment }}.tfvars" \
            -input=false

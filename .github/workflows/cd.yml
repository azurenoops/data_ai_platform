name: cd

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment / terraform workspace'
        required: true
        default: prod
        type: choice
        options: [dev, prod]
  workflow_run:
    workflows: ['terraform']
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read
  actions: read

env:
  WORKSPACE: ${{ github.event.inputs.environment || 'prod' }}

jobs:
  deploy:
    name: deploy app code
    # Only run on workflow_dispatch, OR if the upstream terraform run succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: tfout-${{ env.WORKSPACE }}
          path: infra
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export terraform outputs
        run: |
          set -eu
          test -f infra/tfout.json
          echo "RESOURCE_GROUP=$(jq -r '.AZURE_RESOURCE_GROUP.value' infra/tfout.json)" >> "$GITHUB_ENV"
          echo "APP_SERVICE_NAME=$(jq -r '.APP_SERVICE_NAME.value' infra/tfout.json)" >> "$GITHUB_ENV"
          echo "FUNCTION_APP_NAME=$(jq -r '.FUNCTION_APP_NAME.value' infra/tfout.json)" >> "$GITHUB_ENV"
          echo "MCP_SERVER_BASE_URL=$(jq -r '.MCP_SERVER_BASE_URL.value' infra/tfout.json)" >> "$GITHUB_ENV"

      - name: Build & publish MCP server
        run: |
          dotnet publish src/DataAiMcp.McpServer/DataAiMcp.McpServer.csproj \
            --configuration Release \
            --output publish/mcp-server \
            /p:UseAppHost=false
          (cd publish/mcp-server && zip -qr ../mcp-server.zip .)

      - name: Build & publish ingestion functions
        run: |
          dotnet publish src/DataAiMcp.Ingestion.Functions/DataAiMcp.Ingestion.Functions.csproj \
            --configuration Release \
            --output publish/functions \
            /p:UseAppHost=false
          (cd publish/functions && zip -qr ../functions.zip .)

      - name: Deploy MCP server (App Service)
        run: |
          az webapp deploy \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${APP_SERVICE_NAME}" \
            --type zip \
            --src-path publish/mcp-server.zip \
            --restart true

      - name: Deploy ingestion functions (FlexConsumption)
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${FUNCTION_APP_NAME}" \
            --src publish/functions.zip

      - name: Run postdeploy smoke
        env:
          TFOUT_JSON: ${{ github.workspace }}/infra/tfout.json
        run: |
          chmod +x infra/scripts/postdeploy.sh
          infra/scripts/postdeploy.sh
